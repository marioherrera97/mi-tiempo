# Regenera vendor/lakes.json y vendor/rivers.json: Natural Earth para todo el mundo y, en España
# y Portugal, los embalses y lagos de OpenStreetMap (© colaboradores de OpenStreetMap, ODbL).
# Se lanza a mano (pestaña Actions) porque estos datos apenas cambian.
name: Actualizar ríos, lagos y embalses

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  hydro:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Descargar Natural Earth
        run: |
          mkdir -p ne
          for f in ne_10m_lakes ne_10m_lakes_europe ne_10m_rivers_lake_centerlines ne_10m_rivers_europe; do
            curl -sSfL --retry 3 -o ne/$f.geojson https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/$f.geojson
          done

      - name: Descargar embalses y lagos de OpenStreetMap
        run: |
          # En cuatro trozos para no saturar los servidores de Overpass
          n=0
          for B in '35.8,-9.9,40.0,-2.6' '35.8,-2.6,40.0,4.6' '40.0,-9.9,44.0,-2.6' '40.0,-2.6,44.0,4.6'; do
            n=$((n+1))
            Q="[out:json][timeout:600];(
              way[\"natural\"=\"water\"][\"water\"~\"^(reservoir|lake|lagoon|basin)$\"][\"name\"]($B);
              relation[\"natural\"=\"water\"][\"water\"~\"^(reservoir|lake|lagoon|basin)$\"]($B);
              way[\"landuse\"=\"reservoir\"][\"name\"]($B);
              relation[\"landuse\"=\"reservoir\"]($B);
            );out geom;"
            ok=0
            for try in 1 2 3; do
              for url in https://overpass-api.de/api/interpreter https://overpass.private.coffee/api/interpreter https://overpass.kumi.systems/api/interpreter; do
                if curl -sSf --max-time 900 -A 'MiTiempo/1.0 (+https://github.com/marioherrera97/mi-tiempo)' \
                     -o osm_$n.json --data-urlencode "data=$Q" "$url" \
                   && python -c "import json; d=json.load(open('osm_$n.json')); assert len(d['elements']) > 50, len(d['elements'])"; then
                  echo "Trozo $n OK desde $url"; ok=1; break 2
                fi
                echo "Trozo $n falló en $url"; sleep 20
              done
              sleep 60
            done
            [ $ok = 1 ] || exit 1
          done
          # Une los trozos sin repetir lo que cae en dos a la vez
          python -c "import json, glob; u = {(e['type'], e['id']): e for f in sorted(glob.glob('osm_*.json')) for e in json.load(open(f))['elements']}; json.dump({'elements': list(u.values())}, open('osm.json', 'w')); print(len(u), 'elementos')"
          ls -la osm*.json

      - name: Generar ficheros
        run: python pipeline/hydro.py ne vendor osm.json

      - name: Guardar en el repositorio y publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add vendor/lakes.json vendor/rivers.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Embalses y lagos de OpenStreetMap en España y Portugal"
          git push
          # Los push hechos con el token de Actions no lanzan otros flujos: se publica a mano
          gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"
