# Publica Mi Tiempo en GitHub Pages junto con los datos propios del ECMWF para el mapa
# y la lluvia de los pluviómetros de AEMET.
# Se ejecuta al subir cambios y cada hora: los pluviómetros cambian cada hora y el ECMWF solo se descarga
# cuando hay una pasada nueva (cada 6 horas; si no la hay, ese paso termina en segundos).
# Los datos no se guardan en Git: viven en la caché de Actions y en la web publicada.
name: Publicar web y datos ECMWF

on:
  push:
    branches: [main]
  schedule:
    - cron: '40 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Dependencias
        run: pip install -r pipeline/requirements.txt

      # Recupera la última pasada ya generada para no descargarla otra vez
      - name: Caché de datos ECMWF
        uses: actions/cache@v4
        with:
          path: data/ecmwf
          key: ecmwf-${{ github.run_id }}
          restore-keys: ecmwf-

      - name: Descargar y convertir ECMWF
        run: python pipeline/ecmwf.py data/ecmwf

      # Lluvia de las últimas horas en cada pluviómetro: AEMET solo da ~12 h, así que se va guardando
      # lo de cada hora (fuera de la web publicada) para poder sumar 24 h
      - name: Caché de pluviómetros AEMET
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/aemet
          key: aemet-${{ github.run_id }}
          restore-keys: aemet-

      - name: Pluviómetros AEMET
        continue-on-error: true
        env:
          AEMET_KEY: ${{ secrets.AEMET_KEY }}
        run: python pipeline/pluviometros.py "${{ runner.temp }}/aemet/estado.json" data/pluviometros.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
